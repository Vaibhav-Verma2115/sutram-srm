[project]
name = "sutram-srm"
version = "0.1.0"
description = "Deep Learning Super-Resolution Mapping: Sentinel-2 10m -> 2.5m (SIH)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "torch>=2.2",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "streamlit>=1.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sr = ["sen2sr", "opensr-model", "mlstac"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srm"]
